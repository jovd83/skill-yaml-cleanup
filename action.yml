name: skill-lint
description: Lint AgentSkill folders - frontmatter, name, description, development-tree paths, model-run telemetry, and optionally the README standard.
author: jovd83
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Skill folder, SKILL.md, or a tree of skills to lint.
    default: "."
  readme:
    description: Also check each repository README against skill-readme-standard ("true" or "false").
    default: "false"
  strict:
    description: Fail on warnings too ("true" or "false").
    default: "false"
  args:
    description: Extra arguments for skill_lint.py, for example "--skip keys,author-version".
    default: ""

runs:
  using: composite
  steps:
    - name: Fetch skill-readme-standard
      if: inputs.readme == 'true'
      uses: actions/checkout@v7
      with:
        repository: jovd83/skill-readme-standard
        path: .skill-lint-readme-standard

    - name: Run skill-lint
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        LINT_README: ${{ inputs.readme }}
        LINT_STRICT: ${{ inputs.strict }}
        LINT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        py=$(command -v python3 || command -v python)
        if ! "$py" -c "import yaml" 2>/dev/null; then
          # PyYAML goes into a private venv so the job's own Python stays untouched.
          venv="$RUNNER_TEMP/skill-lint-venv"
          "$py" -m venv "$venv"
          py="$venv/bin/python"
          [ -x "$py" ] || py="$venv/Scripts/python.exe"
          "$py" -m pip install --quiet "pyyaml>=6.0.1,<7"
        fi
        opts=()
        if [ "$LINT_README" = "true" ]; then
          checker=$(find .skill-lint-readme-standard -name check_readme.py -path '*scripts*' | head -n 1)
          opts+=(--readme --readme-checker "$checker")
        fi
        if [ "$LINT_STRICT" = "true" ]; then
          opts+=(--strict)
        fi
        # LINT_ARGS is split on whitespace on purpose: it carries extra flags.
        # shellcheck disable=SC2086
        "$py" "$GITHUB_ACTION_PATH/scripts/skill_lint.py" "$LINT_PATH" "${opts[@]}" $LINT_ARGS
